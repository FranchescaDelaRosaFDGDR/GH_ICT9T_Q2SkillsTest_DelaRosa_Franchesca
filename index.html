<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            background-image: url(https://cdn.creativefabrica.com/2022/03/09/White-abstract-background-on-3d-design-Graphics-26730412-1.jpg);
            background-size: fixed;
        }
        img {
            width: 65px;
            height: 60px;
        }
    </style>
    <title>OBMC Enroll Now</title>
</head>
<body>
   <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
          <a href="index.html" class="navbar-brand">
      <img src="OBMC Logo (1).png" alt="Logo" height="40">
          </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar" aria-controls="mynavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Enroll Now</a></li>
                </ul>
                <form class="d-flex" role="search">
                    <input type="text" class="form-control me-2" placeholder="Search" aria-label="Search">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <h2 class="text-center" style="padding: 30px; color: #001d3d;"><b>Student Enrollment Form</b></h2>
    <h6 class="text-center" style="padding: 30px; color: #001d3d;">Kindly fill out this form to enroll for the upcoming school year.</h6>
    <div class="container mt-3">
    <form>
        <h4 style="color: #001d3d;"><b>Student's Information</b></h4>
           <div class="mt-3 mb-3" style="color: #001d3d;">
            <label><b>Full Name:</b></label>   
                <input type="textbox" placeholder="Enter your name" class="form-control">
            <label><b>Birth Date:</b></label>   
                <input type="textbox" placeholder="Enter your birth date" class="form-control">
            </div>
             <div class="mb-3" style="color: #001d3d;">
                <label><b>Gender:</b></label><br>
                <label>Female</label><input type="radio" name="gender" class="form-check-input">
                <label>Male</label><input type="radio" name="gender" class="form-check-input">
            </div>
            <div class="mb-3" style="color: #001d3d;">
            <label class="form-label"><b>Grade Level:</b></label>
            <select class="form-select">
                <option>--- Select Student's Grade Level ---</option>
                <option>Junior Casa (Pre-Kindergarten 1)</option>
                <option>Junior Advanced Casa (Pre-Kindergarten 2)</option>
                <option>Advanced Casa (Kindergarten)</option>
                <option>Grade 1 (Primary)</option>
                <option>Grade 2 (Primary)</option>
                <option>Grade 3 (Primary)</option>
                <option>Grade 4 (Intermediate)</option>
                <option>Grade 5 (Intermediate)</option>
                <option>Grade 6 (Intermediate)</option>
                <option>Grade 7 (Junior High School)</option>
                <option>Grade 8 (Junior High School)</option>
                <option>Grade 9 (Junior High School)</option>
                <option>Grade 10 (Junior High School)</option>
                <option>Grade 11 (Senior High School)</option>
                <option>Grade 12 (Senior High School)</option>
                <option>Alumni</option>
            </select>
            </div>
            <div class="mt-3 mb-3" style="color: #001d3d;">
             <h4><b>Contact Details</b></h4>
            <label><b>Email Address:</b></label>   
                <input type="textbox" placeholder="Enter your email address" class="form-control">
              <label><b>Contact Number:</b></label>   
                <input type="textbox" placeholder="Enter your contact number" class="form-control">
            </div>
            <div class="mb-3" style="color: #001d3d;">
            <h4><b>Other Information:</b></h4>
                <label><b>Select your chosen mode of learning:</b></label><br>
                <label>Online</label><input type="radio" name="gender" class="form-check-input"><br>
                <label>Face-to-Face</label><input type="radio" name="gender" class="form-check-input">
            </div>
            <div class="d-grid gap-3" style="color: #001d3d;">
                <label style="display: flex; align-items: center;">
                <input type="checkbox">I confirm that all the information in this form is accurate and complete.
                </label>      
            </div>
            <div class="d-grid gap-3" style="color: #001d3d;">
                <button type="submit" class="btn btn-primary btn-block">submit</button>
                <button type="reset" class="btn btn-outline-danger btn-block">clear</button>
            </div>
        </form>
    </div><br>
    <footer id="footer" class="text-center" style="background-color: #001d3d; color: white;">
    © 2025 Stydent Enrollment System |  Franchesca Dela Rosa 9 - Topaz
    </footer>
</body>
</html>
